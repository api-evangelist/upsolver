aid: upsolver
name: Upsolver
description: >-
  Upsolver is a cloud data ingestion and lakehouse pipeline company whose
  SQLake platform lets teams build and deploy high-scale streaming data
  pipelines using familiar SQL, with automatic schema evolution and Apache
  Iceberg optimization. Upsolver was acquired by Qlik and the product now
  continues as Qlik Open Lakehouse; the standalone Upsolver (SQLake) product
  is legacy, with documentation maintained under Qlik's help site and
  first-party Python SDK, CLI, and dbt tooling still published on PyPI.
