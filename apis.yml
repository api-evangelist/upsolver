apis:
- name: Upsolver SQLake API
  description: >-
    HTTP API behind the Upsolver SQLake platform, used by the first-party
    Python SDK (DB API 2.0), CLI, and dbt adapter to execute SQLake SQL
    statements (DDL, DML, continuous data loading). Authenticated with a
    personal API token generated in the SQLake console plus an
    account-specific API URL. No OpenAPI is published; the product is legacy
    following the Qlik acquisition.
